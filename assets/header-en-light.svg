<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Brandon Kamga, Backend, Platform &amp; DevOps">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#f3f4f6" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="0.5" y="0.5" width="1199" height="319" rx="16"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 15px; }
      .fade { animation: appear 0.01s both; }
      @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes type0 { to { transform: translateX(54.3px); } } @keyframes type1 { to { transform: translateX(99.6px); } } @keyframes type2 { to { transform: translateX(108.6px); } }
      @media (prefers-reduced-motion: reduce) {
        .fade, .cursor { animation: none !important; }
        .cover { display: none; }
      }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#ffffff"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#d0d7de"/>

  <text x="64" y="84" class="sans" font-size="13" font-weight="600" letter-spacing="2" fill="#59636e">SOFTWARE ENGINEER  ·  YAOUNDÉ, CAMEROON</text>
  <text x="62" y="146" class="sans" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#1f2328">Brandon Kamga</text>
  <text x="64" y="184" class="sans" font-size="24" font-weight="500" fill="#1f2328">Backend, Platform &amp; DevOps</text>
  <text x="64" y="222" class="sans" font-size="19" fill="#59636e">I design and ship production systems end to end,</text><text x="64" y="252" class="sans" font-size="19" fill="#59636e">from the domain model to the infrastructure.</text>

  <rect x="680" y="36" width="456" height="248" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="704" cy="60" r="5.5" fill="#d0d7de"/><circle cx="723" cy="60" r="5.5" fill="#d0d7de"/><circle cx="742" cy="60" r="5.5" fill="#d0d7de"/>
  <text x="1112" y="65" text-anchor="end" class="mono" font-size="12" fill="#59636e">~/brandonkamga237</text>
  <line x1="680" y1="80" x2="1136" y2="80" stroke="#d0d7de"/>
  <text x="712" y="110" class="mono fade" style="animation-delay:0.50s"><tspan fill="#59636e">$</tspan><tspan dx="10" fill="#1f2328">whoami</tspan></text><rect class="cover" x="730" y="95" width="58.3" height="20" fill="#f6f8fa" style="animation: type0 0.42s steps(6, end) 0.50s both"/><text x="712" y="132" class="mono fade" fill="#59636e" style="animation-delay:1.17s">brandon: engineer, founder of lescracks</text><text x="712" y="162" class="mono fade" style="animation-delay:1.72s"><tspan fill="#59636e">$</tspan><tspan dx="10" fill="#1f2328">focus --now</tspan></text><rect class="cover" x="730" y="147" width="103.6" height="20" fill="#f6f8fa" style="animation: type1 0.77s steps(11, end) 1.72s both"/><text x="712" y="184" class="mono fade" fill="#59636e" style="animation-delay:2.74s">distributed backends · platforms · infra</text><text x="712" y="214" class="mono fade" style="animation-delay:3.29s"><tspan fill="#59636e">$</tspan><tspan dx="10" fill="#1f2328">stack --core</tspan></text><rect class="cover" x="730" y="199" width="112.6" height="20" fill="#f6f8fa" style="animation: type2 0.84s steps(12, end) 3.29s both"/><text x="712" y="236" class="mono fade" fill="#59636e" style="animation-delay:4.38s">java · spring · go · typescript · python</text><text x="712" y="266" class="mono fade" fill="#59636e" style="animation-delay:4.93s">$</text><rect class="cursor" x="730" y="252" width="9" height="18" fill="#1f2328" style="animation: appear 0.01s 4.93s both, blink 1.1s steps(1) 4.93s infinite"/>
</svg>

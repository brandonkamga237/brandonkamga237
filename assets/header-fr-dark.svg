<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Brandon Kamga, Backend, Plateforme &amp; DevOps">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/><stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#0d1117" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="card"><rect x="0.5" y="0.5" width="1199" height="319" rx="16"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 15px; }
      @keyframes blink { 50% { opacity: 0; } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#0d1117"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#fade)"/>
    <rect width="1200" height="4" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#30363d"/>

  <text x="64" y="84" class="sans" font-size="13" font-weight="600" letter-spacing="2" fill="#2f81f7">INGÉNIEUR LOGICIEL  ·  YAOUNDÉ, CAMEROUN</text>
  <text x="62" y="146" class="sans" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#e6edf3">Brandon Kamga</text>
  <text x="64" y="184" class="sans" font-size="24" font-weight="500" fill="url(#accent)">Backend, Plateforme &amp; DevOps</text>
  <text x="64" y="222" class="sans" font-size="19" fill="#8b949e">Je conçois et livre des systèmes en production,</text><text x="64" y="252" class="sans" font-size="19" fill="#8b949e">du modèle métier jusqu'à l'infrastructure.</text>

  <rect x="680" y="36" width="456" height="248" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle cx="704" cy="60" r="5.5" fill="#ff5f57"/><circle cx="723" cy="60" r="5.5" fill="#febc2e"/><circle cx="742" cy="60" r="5.5" fill="#28c840"/>
  <text x="1112" y="65" text-anchor="end" class="mono" font-size="12" fill="#8b949e">~/brandonkamga237</text>
  <line x1="680" y1="80" x2="1136" y2="80" stroke="#30363d"/>
  <text x="712" y="110" class="mono"><tspan fill="#3fb950">$</tspan><tspan dx="10" fill="#e6edf3">whoami</tspan></text><text x="712" y="132" class="mono" fill="#8b949e">brandon : des systèmes qui tournent en prod</text><text x="712" y="162" class="mono"><tspan fill="#3fb950">$</tspan><tspan dx="10" fill="#e6edf3">focus --now</tspan></text><text x="712" y="184" class="mono" fill="#8b949e">backends distribués · plateformes · infra</text><text x="712" y="214" class="mono"><tspan fill="#3fb950">$</tspan><tspan dx="10" fill="#e6edf3">stack --core</tspan></text><text x="712" y="236" class="mono" fill="#8b949e">java · spring · go · typescript · postgres</text><text x="712" y="266" class="mono" fill="#3fb950">$</text>
  <rect class="cursor" x="730" y="252" width="9" height="18" fill="#2f81f7"/>
</svg>

name: Profile widgets

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Latest writing
        run: |
          python3 scripts/update_writing.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.fr.md
          git diff --cached --quiet || { git commit -m "Update latest writing" && git push; }

      - name: Activity cards
        run: python3 scripts/gen_stats.py dist
        env:
          # Optional STATS_TOKEN (classic PAT, read:user + repo) also counts private contributions.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update profile widgets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Profile widgets

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats and languages cards
        run: python3 scripts/gen_stats.py dist
        env:
          # Optional STATS_TOKEN (classic PAT, read:user + repo) also counts private contributions.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#1f2328
            dist/snake-dark.svg?palette=github-dark&color_snake=#e6edf3

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update profile widgets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
